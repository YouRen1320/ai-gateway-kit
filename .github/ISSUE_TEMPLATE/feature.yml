name: Feature request
description: Propose a reusable deployment-core improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the reusable deployment problem, not a product-specific customization.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Migration, security, and rollback impact
    validations:
      required: true
