name: Runtime smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Run isolated runtime, backup, and restore test
        env:
          AI_GATEWAY_SMOKE: "1"
        run: ./tests/smoke.sh
