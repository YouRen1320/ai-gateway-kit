vulnerabilities:
  - id: CVE-2025-68121
    paths:
      - usr/local/bin/gosu
    expired_at: 2027-01-10
    statement: >-
      The PostgreSQL image uses gosu only for local UID switching; the affected
      crypto/tls session-resumption path is not invoked. Re-verified on
      2026-09-28: postgres 18.6 alpine3.23/3.24 (linux/amd64) still bundle gosu
      1.19 built with go1.24.6, and no fixed rebuild (go1.24.13+ / 1.25.7+)
      has been published upstream yet. Remove this exception as soon as the
      official image rebuilds gosu with a fixed Go toolchain.
