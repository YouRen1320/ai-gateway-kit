services:
  proxy:
    image: ${CADDY_IMAGE:?Run ./bin/setup before starting the proxy}
    restart: unless-stopped
    depends_on:
      sub2api:
        condition: service_healthy
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
      - "${PROXY_HTTPS_PORT:-443}:443/udp"
    environment:
      GATEWAY_DOMAIN: ${GATEWAY_DOMAIN:?Set GATEWAY_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
      MAX_REQUEST_BODY_SIZE: ${MAX_REQUEST_BODY_SIZE:-256MB}
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend

volumes:
  caddy_data:
  caddy_config:
